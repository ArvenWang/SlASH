<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060d11" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>PROJECT SLASH</title>
  </head>
  <body>
    <main id="game-shell">
      <canvas id="game-canvas" aria-label="Project Slash 几何战斗场景"></canvas>
      <div id="hud" aria-hidden="true">
        <div class="hud-top">
          <div id="health-pips" class="health-pips"></div>
          <span id="stage-label"></span>
        </div>
        <div id="boss-module" class="boss-module">
          <span id="boss-label"></span>
          <b class="boss-track"><i id="boss-fill"></i></b>
        </div>
        <div id="energy-module" class="energy-module">
          <span id="energy-label">能量 000</span>
          <b class="energy-track"><i id="energy-fill"></i></b>
        </div>
      </div>
      <div id="reticle" aria-hidden="true"></div>
      <button id="touch-ultimate" type="button">终极</button>
      <button id="touch-cancel" type="button">取消</button>
      <div id="campaign-ui"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
