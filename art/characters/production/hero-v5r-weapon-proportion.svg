<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Cold Blade V5R weapon proportion specification</title>
  <desc id="description">Exact 58, 62 and 66 percent weapon-to-character height comparisons and the selected 62 percent weapon anchor layout.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f0ee"/>
      <stop offset="1" stop-color="#d9d9d7"/>
    </linearGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#343a3e"/>
      <stop offset="0.55" stop-color="#15191c"/>
      <stop offset="1" stop-color="#080b0d"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bdebf4"/>
      <stop offset="0.24" stop-color="#ffffff"/>
      <stop offset="0.82" stop-color="#edfefe"/>
      <stop offset="1" stop-color="#95dbe8"/>
    </linearGradient>
    <filter id="bladeGlow" x="-80%" y="-30%" width="260%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .label { font: 600 18px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .12em; fill: #2a3034; }
      .small { font: 500 13px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em; fill: #586065; }
      .metric { font: 700 24px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #161b1e; }
      .guide { stroke: #8c9498; stroke-width: 1; stroke-dasharray: 5 6; fill: none; }
      .measure { stroke: #333b3f; stroke-width: 1.5; fill: none; }
      .anchor { fill: #ff633f; stroke: #fff; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#page)"/>
  <path d="M800 46V854" stroke="#b7bcbe" stroke-width="1"/>
  <text x="64" y="65" class="label">COLD BLADE / V5R</text>
  <text x="64" y="94" class="small">EXACT BODY-TO-WEAPON PROPORTION · BODY HEIGHT = 1.000</text>

  <!-- Exact 660 px character height, y=120..780. -->
  <g aria-label="hero scale silhouette">
    <path d="M248 139L280 120L312 139L309 191L280 216L251 191Z" fill="url(#armor)"/>
    <path d="M255 170L280 182L305 170L300 187L280 196L260 187Z" fill="#eafcff"/>
    <path d="M264 211L296 211L302 236L346 258L327 385L304 472L280 500L256 472L233 385L214 258L258 236Z" fill="url(#armor)"/>
    <path d="M220 261L178 284L151 448L177 455L207 336L228 323Z" fill="#1c2124"/>
    <path d="M340 261L382 284L409 448L383 455L353 336L332 323Z" fill="#1c2124"/>
    <path d="M151 448L145 519L169 532L181 455Z" fill="#111518"/>
    <path d="M409 448L415 519L391 532L379 455Z" fill="#111518"/>
    <path d="M258 468L277 497L264 616L238 767L197 767L221 600L228 484Z" fill="#151a1d"/>
    <path d="M302 468L283 497L296 616L322 767L363 767L339 600L332 484Z" fill="#151a1d"/>
    <path d="M194 751L239 751L247 780H185Z" fill="#0b0e10"/>
    <path d="M366 751L321 751L313 780H375Z" fill="#0b0e10"/>
    <path d="M249 236L280 257L311 236L324 295L280 323L236 295Z" fill="#353b3f" opacity=".68"/>
  </g>
  <line x1="112" y1="120" x2="112" y2="780" class="measure"/>
  <path d="M104 120H120M104 780H120" class="measure"/>
  <text x="78" y="456" transform="rotate(-90 78 456)" class="small">BODY HEIGHT 100% · 660 PX</text>
  <line x1="60" y1="780" x2="750" y2="780" class="guide"/>

  <!-- 58 percent weapon: 382.8 px total; 11 percent grip: 72.6 px. -->
  <g aria-label="58 percent weapon" transform="translate(0 0)">
    <path d="M488 707Q497 546 496 409Q496 400 489 397Q482 401 482 410Q484 548 480 707Z" fill="url(#blade)" filter="url(#bladeGlow)"/>
    <rect x="467" y="701" width="42" height="12" rx="3" fill="#1a2023"/>
    <rect x="480" y="713" width="16" height="67" rx="5" fill="url(#armor)"/>
    <path d="M480 723L496 739M480 747L496 763" stroke="#4a5257" stroke-width="3"/>
    <line x1="452" y1="397.2" x2="452" y2="780" class="measure"/>
    <path d="M444 397.2H460M444 780H460" class="measure"/>
    <text x="488" y="822" text-anchor="middle" class="metric">58%</text>
    <text x="488" y="846" text-anchor="middle" class="small">0.58H</text>
  </g>

  <!-- 62 percent selected weapon: 409.2 px total. -->
  <g aria-label="62 percent selected weapon">
    <path d="M612 707Q622 524 621 385Q621 374 613 371Q605 375 605 386Q607 526 604 707Z" fill="url(#blade)" filter="url(#bladeGlow)"/>
    <rect x="591" y="701" width="42" height="12" rx="3" fill="#1a2023"/>
    <rect x="604" y="713" width="16" height="67" rx="5" fill="url(#armor)"/>
    <path d="M604 723L620 739M604 747L620 763" stroke="#4a5257" stroke-width="3"/>
    <line x1="576" y1="370.8" x2="576" y2="780" class="measure"/>
    <path d="M568 370.8H584M568 780H584" class="measure"/>
    <text x="612" y="822" text-anchor="middle" class="metric" fill="#cf452a">62%</text>
    <text x="612" y="846" text-anchor="middle" class="small">SELECTED</text>
  </g>

  <!-- 66 percent weapon: 435.6 px total. -->
  <g aria-label="66 percent weapon">
    <path d="M724 707Q735 510 734 360Q734 348 725 344Q716 349 716 361Q719 511 716 707Z" fill="url(#blade)" filter="url(#bladeGlow)"/>
    <rect x="703" y="701" width="42" height="12" rx="3" fill="#1a2023"/>
    <rect x="716" y="713" width="16" height="67" rx="5" fill="url(#armor)"/>
    <path d="M716 723L732 739M716 747L732 763" stroke="#4a5257" stroke-width="3"/>
    <line x1="688" y1="344.4" x2="688" y2="780" class="measure"/>
    <path d="M680 344.4H696M680 780H696" class="measure"/>
    <text x="724" y="822" text-anchor="middle" class="metric">66%</text>
    <text x="724" y="846" text-anchor="middle" class="small">0.66H</text>
  </g>

  <text x="856" y="65" class="label">SELECTED 62% / MODULAR ANCHORS</text>
  <text x="856" y="94" class="small">BLADE 51% · GRIP 11% · TOTAL 62%</text>

  <!-- Exact horizontal selected weapon, scaled 1 px per proportion pixel. -->
  <g transform="translate(890 310)" aria-label="selected weapon broad side">
    <path d="M0 28H73" stroke="#20272b" stroke-width="22" stroke-linecap="round"/>
    <path d="M8 20L25 36M34 20L51 36" stroke="#4b5358" stroke-width="3"/>
    <rect x="69" y="9" width="10" height="38" rx="3" fill="#151a1d"/>
    <path d="M79 20Q238 12 408 0Q414 1 409 7Q244 36 79 36Z" fill="url(#blade)" filter="url(#bladeGlow)"/>
    <circle cx="14" cy="28" r="7" class="anchor"/>
    <circle cx="56" cy="28" r="7" class="anchor"/>
    <circle cx="74" cy="28" r="7" class="anchor"/>
    <circle cx="83" cy="28" r="7" class="anchor"/>
    <circle cx="409" cy="4" r="7" class="anchor"/>
    <text x="14" y="74" text-anchor="middle" class="small">PRIMARY GRIP</text>
    <text x="115" y="98" text-anchor="middle" class="small">SECONDARY GRIP</text>
    <line x1="56" y1="36" x2="92" y2="82" class="guide"/>
    <text x="180" y="-26" text-anchor="middle" class="small">BLADE BASE</text>
    <line x1="83" y1="16" x2="180" y2="-22" class="guide"/>
    <text x="409" y="-20" text-anchor="middle" class="small">BLADE TIP</text>
    <text x="74" y="-45" text-anchor="middle" class="small">GUARD CENTER</text>
    <line x1="74" y1="9" x2="74" y2="-38" class="guide"/>
  </g>

  <g transform="translate(890 520)" aria-label="selected weapon edge view">
    <path d="M0 18H73" stroke="#20272b" stroke-width="14" stroke-linecap="round"/>
    <rect x="69" y="6" width="9" height="24" rx="3" fill="#151a1d"/>
    <path d="M78 15Q238 12 409 8L409 13Q240 23 78 21Z" fill="url(#blade)" filter="url(#bladeGlow)"/>
    <circle cx="245" cy="16" r="7" class="anchor"/>
    <text x="245" y="61" text-anchor="middle" class="small">TRAIL EDGE SAMPLE</text>
    <line x1="245" y1="23" x2="245" y2="50" class="guide"/>
  </g>

  <g transform="translate(890 674)">
    <rect width="618" height="112" rx="8" fill="#ffffff" opacity=".48" stroke="#bdc3c5"/>
    <text x="24" y="30" class="small">RUNTIME CONTRACT</text>
    <text x="24" y="57" class="small">weapon.totalLength = hero.height × 0.62</text>
    <text x="24" y="80" class="small">primaryGrip → rightHandPalm · secondaryGrip → leftHandIK</text>
    <text x="24" y="103" class="small">bladeBase / bladeTip / trailEdge drive VFX from the real weapon transform</text>
  </g>
</svg>
