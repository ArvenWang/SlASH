<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Slash — Character Lab</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0d1216; }
      body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #d9e7ea; }
      canvas { display: block; width: 100%; height: 100%; }
      .label { position: fixed; top: 22px; letter-spacing: .18em; font-size: 11px; text-transform: uppercase; opacity: .72; pointer-events: none; }
      .hero { left: calc(50% - 270px); color: #bff8ff; }
      .enemy { left: calc(50% + 150px); color: #ff7654; }
      .status { position: fixed; left: 22px; bottom: 20px; font-size: 10px; line-height: 1.7; letter-spacing: .12em; opacity: .54; text-transform: uppercase; pointer-events: none; }
      .character-lab-clean-capture .label, .character-lab-clean-capture .status { display: none; }
    </style>
  </head>
  <body>
    <canvas id="character-lab"></canvas>
    <div class="label hero">Cold Blade / Hero</div>
    <div class="label enemy">Vermilion Enforcer / Enemy</div>
    <div class="status">Character / Animation Lab · mode · speed · loop · freezeMs · front / side / back / 3/4 / gameplay</div>
    <script type="module" src="/src/character-lab.ts"></script>
  </body>
</html>
