<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Slash — Content Lab</title>
    <style>
      html, body { min-height: 100%; margin: 0; background: #081117; color: #d8e8eb; font: 13px/1.5 ui-monospace, monospace; }
      main { max-width: 980px; margin: 0 auto; padding: 28px; }
      h1 { letter-spacing: .14em; font-size: 18px; }
      section { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin: 18px 0; }
      label { display: grid; gap: 6px; }
      select, button { padding: 9px; color: inherit; background: #12222a; border: 1px solid #60778066; }
      pre { min-height: 360px; overflow: auto; padding: 16px; background: #050b0f; border: 1px solid #60778044; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <main>
      <h1>CONTENT SANDBOX</h1>
      <section>
        <label>LEVEL<select id="level"></select></label>
        <label>ENEMY DEFINITION<select id="enemy"></select></label>
        <label>ABILITY<select id="ability"></select></label>
        <label>TEST UPGRADES<select id="upgrade"><option value="none">NONE</option><option value="debug">RECOVERY ×0.8 + HIT RADIUS ×1.1</option></select></label>
        <label>PROJECTILE<select id="projectile"></select></label>
        <label>OBSTACLE<select id="obstacle"></select></label>
        <label>HAZARD<select id="hazard"></select></label>
      </section>
      <section>
        <button id="load">LOAD LEVEL</button>
        <button id="apply-enemy">APPLY ENEMY</button>
        <button id="activate">ACTIVATE ABILITY</button>
        <button id="spawn-projectile">SPAWN PROJECTILE</button>
        <button id="spawn-obstacle">SPAWN OBSTACLE</button>
        <button id="spawn-hazard">SPAWN HAZARD</button>
        <button id="reset">RESET</button>
      </section>
      <pre id="output"></pre>
    </main>
    <script type="module" src="/src/content-lab.ts"></script>
  </body>
</html>
