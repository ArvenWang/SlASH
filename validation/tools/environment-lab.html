<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Slash — Environment Lab</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #071018; color: #d8e8eb; font: 12px/1.4 ui-monospace, monospace; }
      canvas { display: block; width: 100%; height: 100%; }
      aside { position: fixed; top: 16px; left: 16px; width: 210px; padding: 14px; background: #071018dd; border: 1px solid #60778066; }
      strong, label { display: block; margin: 7px 0; letter-spacing: .1em; }
      select, input { width: 100%; }
    </style>
  </head>
  <body>
    <canvas id="environment-lab"></canvas>
    <aside>
      <strong>ENVIRONMENT LAB</strong>
      <label>PROFILE<select id="profile"><option value="night">NIGHT / RAIN</option><option value="day-inspection">DAY / INSPECTION</option></select></label>
      <label>RAIN<input id="rain" type="range" min="0" max="1" step="0.05" value="1" /></label>
      <label>FOG<input id="fog" type="range" min="0" max="0.02" step="0.0001" value="0.0078" /></label>
      <label>EXPOSURE<input id="exposure" type="range" min="0.5" max="1.5" step="0.01" value="0.98" /></label>
      <label><input id="postfx" type="checkbox" checked /> POST FX</label>
    </aside>
    <script type="module" src="/src/environment-lab.ts"></script>
  </body>
</html>
