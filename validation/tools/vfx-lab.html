<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Slash — VFX Lab</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #071018; color: #d8e8eb; font: 12px/1.4 ui-monospace, monospace; }
      canvas { display: block; width: 100%; height: 100%; }
      aside { position: fixed; top: 16px; left: 16px; width: 180px; padding: 14px; background: #071018dd; border: 1px solid #60778066; }
      strong { display: block; margin-bottom: 10px; letter-spacing: .16em; }
      button { width: 100%; margin: 3px 0; padding: 7px; color: inherit; background: #15232a; border: 1px solid #60778066; cursor: pointer; }
    </style>
  </head>
  <body>
    <canvas id="vfx-lab"></canvas>
    <aside>
      <strong>VFX LAB</strong>
      <button data-effect="dash">DASH / SLASH</button>
      <button data-effect="hit">HIT CONTACT</button>
      <button data-effect="kill">KILL / BLOOD</button>
      <button data-effect="blood">BLOOD ONLY</button>
      <button data-effect="camera-impact">CAMERA IMPACT</button>
      <button data-effect="all">ALL</button>
    </aside>
    <script type="module" src="/src/vfx-lab.ts"></script>
  </body>
</html>
