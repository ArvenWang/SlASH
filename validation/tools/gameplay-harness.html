<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project Slash Gameplay Acceptance Harness</title>
  </head>
  <body>
    <pre id="result">RUNNING</pre>
    <script type="module">
      import {
        runGameplayAcceptanceCheck,
        runGameplaySelfCheck,
      } from "/src/game/game.ts";

      try {
        const result = {
          ok: true,
          selfCheck: runGameplaySelfCheck(),
          acceptance: runGameplayAcceptanceCheck(),
        };
        window.gameplay_acceptance_result = result;
        document.querySelector("#result").textContent = JSON.stringify(result, null, 2);
      } catch (error) {
        const failure = {
          ok: false,
          message: error instanceof Error ? error.message : String(error),
          stack: error instanceof Error ? error.stack : null,
        };
        window.gameplay_acceptance_result = failure;
        document.querySelector("#result").textContent = JSON.stringify(failure, null, 2);
        console.error(error);
      }
    </script>
  </body>
</html>
