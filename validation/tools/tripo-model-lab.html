<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Slash — Generated Model Lab</title>
    <style>
      :root { color-scheme: dark; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0b1013; }
      body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #d8e9eb; }
      canvas { display: block; width: 100%; height: 100%; }
      .hud { position: fixed; inset: 0; pointer-events: none; }
      .title { position: absolute; top: 22px; left: 24px; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #b8f4fb; }
      .status { position: absolute; top: 48px; left: 24px; max-width: 520px; font-size: 12px; line-height: 1.55; color: #93a8ac; }
      .stats { position: absolute; right: 24px; top: 22px; padding: 14px 16px; min-width: 220px; background: rgba(7, 11, 13, .72); border: 1px solid rgba(159, 221, 229, .15); font: 10px/1.65 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; color: #a8bec1; backdrop-filter: blur(12px); }
      .hint { position: absolute; left: 24px; bottom: 20px; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; opacity: .48; }
      .clean .hud { display: none; }
    </style>
  </head>
  <body>
    <canvas id="tripo-model-lab"></canvas>
    <div class="hud">
      <div class="title">Generated Model Inspection</div>
      <div class="status" id="model-status">Waiting for a local GLB model URL.</div>
      <pre class="stats" id="model-stats">No model loaded</pre>
      <div class="hint">Drag to orbit · Wheel to zoom · URL: model / view / clip / clean</div>
    </div>
    <script type="module" src="/src/tripo-model-lab.ts"></script>
  </body>
</html>
